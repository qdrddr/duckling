name: Docker

on:
  workflow_dispatch:
    inputs:
      push:
        description: Push multi-arch manifest to Docker Hub
        type: boolean
        default: true
      image_tag:
        description: Docker tag (e.g. 0.2.0.2-r4)
        type: string
        required: false
  push:
    tags:
      - "*.*.*"
      - "*.*.*-*"

env:
  IMAGE: bbkudk/duckling

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: github.event_name != 'workflow_dispatch' || inputs.push
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.value }}-${{ matrix.suffix }}

  merge:
    name: Merge manifest
    needs: build
    if: github.event_name != 'workflow_dispatch' || inputs.push
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.image_tag }}" ]; then
            echo "value=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            echo "value=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create multi-arch manifest
        run: |
          tag="${{ steps.tag.outputs.value }}"
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:${tag}" \
            -t "${{ env.IMAGE }}:latest" \
            "${{ env.IMAGE }}:${tag}-amd64" \
            "${{ env.IMAGE }}:${tag}-arm64"
